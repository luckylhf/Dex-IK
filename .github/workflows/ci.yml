name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          activate-environment: dex-ik
          environment-file: environment.yml
          conda-remove-defaults: "true"

      - name: Install dex-ik
        shell: bash -el {0}
        run: python -m pip install --no-deps -e .

      - name: Run tests
        shell: bash -el {0}
        run: python -m unittest discover -s tests -v

      - name: Run shared-library test (3.10 only)
        if: matrix.python-version == '3.10'
        shell: bash -el {0}
        run: DEX_IK_TEST_SHARED_LIBRARY=1 python -m unittest tests.test_solver -v

      - name: Run example
        shell: bash -el {0}
        run: python examples/solve_dual_arm.py
